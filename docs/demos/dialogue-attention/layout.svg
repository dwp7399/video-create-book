<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img"><style>text{font-family:system-ui,sans-serif;fill:#172033;font-size:18px}.small{font-size:14px}</style><rect width="1000" height="680" fill="#f8fafc"/><text x="35" y="38">对话空间：北在上，所有摄影机在甲—乙轴线南侧</text><rect x="260" y="115" width="480" height="115" rx="20" fill="#e2e8f0"/><path d="M100 160H900" stroke="#64748b" stroke-dasharray="8 6"/><text x="750" y="148" class="small">甲—乙轴线 / y=0</text><path d="M760 390L240 160" stroke="#155e75" stroke-width="2"/><rect x="734" y="374" width="52" height="32" rx="6" fill="#155e75"/><text x="660" y="435">C甲：观察请求者</text><path d="M240 390L760 160" stroke="#9a3412" stroke-width="2"/><rect x="214" y="374" width="52" height="32" rx="6" fill="#9a3412"/><text x="140" y="435">C乙：观察评估者</text><path d="M500 510L500 160" stroke="#475569" stroke-width="2"/><rect x="474" y="494" width="52" height="32" rx="6" fill="#475569"/><text x="400" y="555">W：观察两人关系</text><circle cx="240" cy="160" r="28" fill="#155e75"/><text x="231" y="166" style="fill:white">甲</text><circle cx="760" cy="160" r="28" fill="#9a3412"/><text x="751" y="166" style="fill:white">乙</text><text x="410" y="205" class="small">单据 → 中央；相机 乙 → 甲</text><text x="35" y="620">屏幕关系：双人镜甲左乙右；甲看画右，乙看画左。</text><text x="35" y="652" class="small">俯视位置图不表示焦距、视锥或取景下缘；手、单据及接物区仍须在分镜中另行保留。</text></svg>