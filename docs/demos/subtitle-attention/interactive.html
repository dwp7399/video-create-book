<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文字、动作与注意力分配</title><style>body{max-width:900px;margin:30px auto;padding:0 20px;font:18px/1.7 system-ui;background:#f8fafc;color:#172033}svg{width:100%;border:1px solid #94a3b8}select{font:inherit;max-width:100%}input{width:100%}label,output{display:block}text{font-family:system-ui,sans-serif}</style>
<h1>字幕与画面信息竞争</h1><p>原创教程示意，固定画面与两句话，只改变文字位置、分段或出现时机。无配音；这里的文字是教学说明，不是对白无障碍字幕。</p>
<label>版本<select id="variant"><option value="P0">P0 同时显示，遮住目标区</option><option value="P1">P1 只把文字移到上方</option><option value="P2">P2 再把两句话分段</option><option value="P3">P3 再把结果说明移到动作之后</option></select></label>
<label for="time">拖动时间观察同一个动作</label><input type="range" id="time" min="0" max="12" step="0.1" value="4.5"><output id="clock"></output>
<svg viewBox="0 0 640 360" role="img" aria-label="蓝色方块在4至6秒移动到右侧框内；字幕可切换位置和时机"><rect width="640" height="360" fill="#e2e8f0"/><path d="M170 205H480" stroke="#94a3b8" stroke-dasharray="6 4"/><rect id="target" x="445" y="170" width="70" height="70" fill="none" stroke="#475569" stroke-width="5"/><rect id="block" x="150" y="185" width="40" height="40" rx="5" fill="#0369a1"/><g id="caption"><rect id="caption-bg" x="100" y="170" width="440" height="88" fill="#0f172a"/><text id="line0" fill="white" font-size="24"></text><text id="line1" fill="white" font-size="24"></text></g></svg>
<p id="status" aria-live="polite"></p><p>P0→P1只换位置；P1→P2只换分段；P2→P3只换第二句时机。P3让4—6秒没有文字，但对需要同步跟做的人可能提示过晚，不是普遍更好。</p><p>相交面积仅描述本示意的矩形布局，不表示阅读难度。各版都没有实际观众效果数据。24px为本演示参数，不是平台标准。</p><noscript>需启用JavaScript查看对照；完整参数见同目录README。</noscript><script src="viewer.js"></script></html>
